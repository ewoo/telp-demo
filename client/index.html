<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortress — The most secure account on the market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 4 7v8c0 7.2 5.1 12.6 12 15 6.9-2.4 12-7.8 12-15V7L16 2Z" fill="#11B5A4"/>
        <path d="M16 2 4 7v8c0 7.2 5.1 12.6 12 15V2Z" fill="#0E9C8D"/>
        <rect x="12.5" y="14" width="7" height="6" rx="1" fill="#0B1F3A"/>
        <path d="M13.5 14v-1.5a2.5 2.5 0 0 1 5 0V14" fill="none" stroke="#0B1F3A" stroke-width="1.4"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Fortress</span>
        <span class="brand-tag">The most secure account on the market</span>
      </div>
    </div>
    <nav class="nav">
      <button data-route="dashboard" class="nav-btn">Accounts</button>
      <button data-route="audit" class="nav-btn">Audit trail</button>
      <span class="who" id="who"></span>
      <button id="reset" class="nav-btn ghost" title="Reset demo to seed state">Reset</button>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="foot">
    <span id="sentinel-status" class="sentinel-status"></span>
    <span class="foot-note">Fortress is a concept build · Team 7 · Sentinel watches every payment</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
